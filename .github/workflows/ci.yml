name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check syntax of changed Python files
        run: |
          CHANGED_PY=$(git diff --name-only HEAD~1..HEAD -- '*.py' 2>/dev/null || true)
          if [ -n "$CHANGED_PY" ]; then
            echo "Checking: $CHANGED_PY"
            FAIL=0
            for f in $CHANGED_PY; do
              [ -f "$f" ] && python -m py_compile "$f" || FAIL=1
            done
            [ $FAIL -ne 0 ] && exit 1
            echo "All syntax checks passed"
          else
            echo "No Python files changed"
          fi

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend unit and integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest \
            tests/unit/test_export_suts_vectorcast.py \
            tests/unit/test_generate_periodic_reports.py \
            tests/unit/test_app_factory.py \
            tests/unit/test_routers.py \
            tests/integration \
            -q --tb=short \
            --cov=backend --cov=workflow --cov=report_gen --cov=generators \
            --cov-report=term-missing --cov-report=html:htmlcov \
            --cov-fail-under=40

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend-v2
        run: npm ci

      - name: Run Vitest
        working-directory: frontend-v2
        run: npm test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t devops-release:${{ github.sha }} .
          docker tag devops-release:${{ github.sha }} devops-release:latest
          echo "Docker image built successfully"

      - name: Save Docker image
        run: docker save devops-release:latest | gzip > devops-release.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: devops-release.tar.gz
          retention-days: 7

  docker-runtime-check:
    name: Docker Runtime Check
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image for runtime check
        run: docker build -t devops-release:runtime-check .

      - name: Start container
        run: docker run -d --name devops-release-runtime -p 7000:7000 devops-release:runtime-check

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:7000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs devops-release-runtime || true
          exit 1

      - name: Stop container
        if: always()
        run: |
          docker rm -f devops-release-runtime || true

  e2e-main:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Install frontend dependencies
        working-directory: frontend-v2
        run: npm ci

      - name: Run full validation
        shell: pwsh
        run: ./scripts/run_full_checks.ps1

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build, docker-runtime-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Deploy notification
        run: |
          echo "🚀 Ready to deploy devops-release:${{ github.sha }}"
          echo "Docker image artifact available for deployment"
          echo "To deploy manually: docker load < devops-release.tar.gz && docker-compose up -d"
